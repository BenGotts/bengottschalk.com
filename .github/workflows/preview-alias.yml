# Points preview.bengottschalk.com at the newest successful Vercel preview
# deployment, from whichever branch it was built. Production deploys are ignored.
#
# Needs a VERCEL_TOKEN repository secret (vercel.com/account/tokens), and a
# VERCEL_SCOPE repository variable with the team slug if the project belongs
# to a Vercel team rather than a personal account.
name: Preview alias

on: deployment_status

permissions:
  contents: read

# Run one at a time in the order deployments finish, so the newest one wins.
concurrency:
  group: preview-alias
  cancel-in-progress: false

jobs:
  alias:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alias preview.bengottschalk.com
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          BRANCH: ${{ github.event.deployment.ref }}
        run: |
          echo "Aliasing $DEPLOYMENT_URL ($BRANCH)"
          npx --yes vercel@63.1.2 alias set "$DEPLOYMENT_URL" preview.bengottschalk.com \
            --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"}
          echo "preview.bengottschalk.com now shows \`$BRANCH\`: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
